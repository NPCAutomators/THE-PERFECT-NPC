name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Zorin — traces conversations, LLM calls, and tool usage. Opt-in via `zorin plugins enable observability/langfuse` or `zorin tools → Langfuse Observability`."
author: NPCAutomators
requires_env:
  - ZORIN_LANGFUSE_PUBLIC_KEY
  - ZORIN_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
